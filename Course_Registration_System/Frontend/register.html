<html>

<head>
    <title>Register a course</title>
    <style>
        h1 {

            margin-top: 100px;
        }

        body {
            background-color: black;
            text-align: center;
        }

        form {
            margin: auto;
            padding: 20px;
            width: 400px;
            background-color: #fff;
        }

        input,
        select,
        button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            font-size: medium;
            cursor: pointer;
        }

        button:hover {
            background-color: #104212;
        }
    </style>

</head>

<body>
    <h1 style="color: gold;">Kickstart with an exciting course</h1>
    <form action="http://localhost:8080/courses/add" method="post">

        <label for="course">Choose a Course</label>
        <select id="course" name="course_name">
            <option value="Java Essentials">Java Essentials</option>
            <option value="Python for ML">Python for ML</option>
            <option value="Spring Boot">Spring Boot</option>
        </select>


        <label for="name">Enter your Name:</label>
        <input type="text" name="name">

        <label for="email">Enter your Email:</label>
        <input type="email" name="email_id">

        <button type="submit">Submit</button>

    </form>


</body>

</html>
